<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- B站 图床防盗链：带本地地址的 Referer 会 403，不带则正常返回 -->
    <meta name="referrer" content="no-referrer" />
    <title>寻影姬 · BiliTune · 网易云 → B站</title>
    <style>
      /* true-black-flat · seed 1114571870
         与桌面版共用令牌：层次只靠明度，强调色只上数据，主操作反白。 */
      :root {
        --ground: #000000;
        --surface: #111111;
        --raised: #1a1a1a;
        --rule: #1a1a1a;
        --control: #2e2e2e;
        --text: #ffffff;
        --muted: #b4b4b4;
        --faint: #949494;
        --accent: #fb7299;
        --accent-soft: rgba(251, 114, 153, 0.16);
        --positive: #3fc07a;
        --warn: #f2b33d;
        --danger: #e5566f;
        --radius-card: 8px;
        --radius-control: 6px;
        --radius-chip: 4px;
        --font: "Segoe UI Variable Text", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
        --num: "Bahnschrift", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--ground);
        color: var(--text);
        font: 14px/1.5 var(--font);
        padding-bottom: env(safe-area-inset-bottom);
        overscroll-behavior-y: contain;
        -webkit-font-smoothing: antialiased;
      }
      .num { font-family: var(--num); font-variant-numeric: tabular-nums; }
      .grow { flex: 1; min-width: 0; }
      :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
      ::selection { background: var(--accent-soft); color: var(--text); }
      .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 80px; }

      /* ---------- header：一条规则，不用毛玻璃 ---------- */
      header {
        position: sticky; top: 0; z-index: 30;
        background: var(--ground);
        border-bottom: 1px solid var(--rule);
        padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
      }
      .head-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
      .logo { width: 26px; height: 26px; color: var(--accent); flex-shrink: 0; }
      h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
      .sub { color: var(--faint); font-size: 12px; margin-top: 1px; }
      .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
      #statusText { display: block; max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
      .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
      .status.ok .dot { background: var(--positive); }
      .status.fail .dot { background: var(--danger); }

      /* ---------- form ---------- */
      .panel { background: var(--surface); border-radius: var(--radius-card); padding: 16px; margin-top: 12px; }
      .panel h2 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
      .row { display: flex; gap: 8px; }
      input[type=text] {
        flex: 1; min-width: 0; height: 44px;
        background: var(--raised); border: 1px solid var(--control); border-radius: var(--radius-control);
        color: var(--text); font: inherit; font-size: 14px; padding: 0 12px; font-family: inherit;
      }
      input[type=text]::placeholder { color: var(--faint); }
      input:focus { outline: none; border-color: var(--text); }
      button {
        min-height: 44px; padding: 0 16px;
        background: var(--raised); color: var(--text);
        border: 1px solid var(--control); border-radius: 999px;
        font-size: 14px; font-weight: 600; font-family: inherit;
        cursor: pointer; white-space: nowrap;
        transition: background .12s, border-color .12s;
      }
      button:active { background: #262626; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      button.primary { background: var(--text); border-color: var(--text); color: #000; }
      button.ghost { background: transparent; }
      button.stop { color: var(--danger); border-color: rgba(229,86,111,.45); }
      button.mini { min-height: 36px; padding: 0 12px; font-size: 13px; font-weight: 500; }
      .samples { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      .hint { color: var(--faint); font-size: 12px; line-height: 1.65; margin: 12px 0 0; }
      .adv { margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 12px; }
      .adv summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; list-style: none; }
      .adv summary::-webkit-details-marker { display: none; }
      .adv summary::before { content: '▸ '; color: var(--faint); }
      .adv[open] summary::before { content: '▾ '; }
      label.check { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--muted); cursor: pointer; }
      label.check input { width: 18px; height: 18px; accent-color: var(--text); }

      /* ---------- progress ---------- */
      .prog { margin-top: 16px; }
      .prog-top { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
      .prog-top .num { font-size: 12px; color: var(--faint); }
      .bar { height: 2px; background: var(--raised); overflow: hidden; }
      .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }

      /* ---------- results ---------- */
      .list { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
      .song { background: var(--surface); border-radius: var(--radius-card); padding: 14px; }
      .song-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .idx { color: var(--faint); font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; min-width: 18px; }
      .song-title { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.01em; }
      .song-sub { color: var(--faint); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tags { display: flex; gap: 6px; flex-wrap: wrap; }
      .tag { font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: var(--radius-chip); white-space: nowrap; }
      .cand { display: flex; gap: 12px; background: var(--raised); border-radius: var(--radius-card); padding: 10px; cursor: pointer; }
      .cand:active { background: #222222; }
      .thumb { position: relative; width: 106px; height: 66px; border-radius: var(--radius-chip); overflow: hidden; background: var(--surface); flex-shrink: 0; }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .dur { position: absolute; right: 3px; bottom: 3px; background: rgba(0,0,0,.78); color: #fff; font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; padding: 1px 5px; border-radius: 3px; }
      .cand-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
      .cand-title { font-size: 14px; font-weight: 600; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      .cand-meta { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .score { font-size: 12px; color: var(--faint); }
      .score b { color: var(--muted); font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 600; }
      .reasons { color: var(--muted); font-size: 13px; line-height: 1.6; margin-top: 10px; padding: 0 2px; }
      .acts { display: flex; gap: 8px; margin-top: 10px; }
      .acts button { flex: 1; }
      .acts button.primary { flex: 1.3; }
      .more { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
      .none { color: var(--faint); font-size: 13px; text-align: center; padding: 16px 0; }

      /* ---------- sheet ---------- */
      .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.66); z-index: 50; display: none; }
      .sheet-bg.on { display: block; }
      .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--surface); border-radius: 12px 12px 0 0; max-height: 88vh; overflow-y: auto; padding: 12px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(101%); transition: transform .28s cubic-bezier(.32,.72,0,1); }
      .sheet.on { transform: translateY(0); }
      .sheet .handle { width: 36px; height: 3px; border-radius: 2px; background: var(--control); margin: 0 auto 14px; }
      .sheet h3 { font-size: 18px; margin: 0 0 10px; line-height: 1.4; font-weight: 600; letter-spacing: -0.01em; }
      .sheet img.big { width: 100%; border-radius: var(--radius-card); background: var(--raised); display: block; margin: 10px 0; }
      .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
      .kv div { font-size: 13px; }
      .kv .k { color: var(--faint); font-weight: 500; font-size: 12px; }
      .kv .v { color: var(--text); word-break: break-all; font-variant-numeric: tabular-nums; }
      .blk { background: var(--raised); border-radius: var(--radius-card); padding: 12px; margin-top: 12px; }
      .blk .t { color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 6px; }
      .blk p { margin: 0; font-size: 13px; line-height: 1.65; color: var(--text); }
      .blk ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; }

      /* ---------- history ---------- */
      .panel h2 .cnt { color: var(--faint); font-weight: 400; font-size: 12px; }
      .hist-list { display: flex; flex-direction: column; margin-top: 8px; }
      .hist { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--rule); cursor: pointer; }
      .hist:first-child { border-top: 0; }
      .hist img { width: 40px; height: 40px; border-radius: var(--radius-chip); object-fit: cover; background: var(--raised); flex-shrink: 0; }
      .hist .hn { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hist .hm { font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
      .hist .hm b { color: var(--accent); font-weight: 600; }
      .hist .del { min-height: 36px; padding: 0 10px; font-size: 13px; color: var(--faint); border-color: transparent; background: transparent; }

      .foot { color: var(--faint); font-size: 12px; line-height: 1.7; text-align: center; margin-top: 28px; }
      .foot code { font-family: var(--num); color: var(--muted); font-size: 12px; }

      .toast {
        position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(8px);
        background: var(--raised); border-radius: var(--radius-control);
        padding: 10px 18px; font-size: 13px; font-weight: 500; color: var(--text);
        opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 90;
      }
      .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
      a { color: var(--text); }
      @media (min-width: 640px) { .thumb { width: 128px; height: 80px; } }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
  </head>
  <body>
    <header>
      <div class="head-inner">
        <svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="10" width="4" height="8" rx="1" fill="currentColor" opacity=".45"/><rect x="9" y="5" width="4" height="18" rx="1" fill="currentColor" opacity=".7"/><path d="M17 8l8 6-8 6z" fill="currentColor"/></svg>
        <div class="grow">
          <h1>寻影姬</h1>
          <div class="sub">BiliTune · 网易云 → B站 MV</div>
        </div>
        <div class="status" id="status"><span class="dot"></span><span id="statusText">检测中</span></div>
      </div>
    </header>

    <div class="wrap">
      <div class="panel">
        <h2>粘贴网易云歌单</h2>
        <div class="row">
          <input type="text" id="input" placeholder="歌单链接 / 分享短链 / 数字 ID" autocomplete="off" />
          <button class="primary" id="go">开始</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button id="goAll" style="flex:1" title="自动一批接一批匹配，直到全部完成或点停止">匹配全部</button>
          <button id="stop" style="display:none;flex:1" class="stop">停止</button>
        </div>
        <div class="samples">
          <button class="mini" data-sample="3778678">热歌榜</button>
          <button class="mini" data-sample="19723756">飙升榜</button>
          <button class="mini" id="prefToggle">双语优先</button>
        </div>
        <p class="hint">支持 <code>music.163.com/#/playlist?id=…</code>、App 分享的 <code>163cn.tv</code> 短链，或直接填数字 ID。</p>

        <details class="adv" id="adv">
          <summary>高级选项</summary>
          <label class="check">
            <input type="checkbox" id="preferBilingual" checked />
            <span>外语歌优先双语字幕（关闭后改为按播放量、弹幕量、本家投稿排序）</span>
          </label>
          <div class="row" style="margin-top:12px;align-items:center;gap:10px">
            <span class="hint" style="margin:0">每批匹配</span>
            <select id="pageSize" style="background:var(--raised);color:var(--text);border:1px solid var(--control);border-radius:6px;padding:8px 10px;font-family:inherit;font-size:13px">
              <option>10</option><option selected>20</option><option>30</option><option>50</option>
            </select>
            <button class="mini ghost" id="clearCache">清空服务端缓存</button>
          </div>
        </details>
      </div>

      <div class="panel" id="histPanel" style="display:none">
        <h2>最近看过 <span class="cnt" id="histCount"></span></h2>
        <input type="text" id="histQ" placeholder="搜索歌单名 / 创建者 / ID" autocomplete="off" style="width:100%" />
        <div class="hist-list" id="histList"></div>
        <button class="mini ghost" id="histAll" style="width:100%;margin-top:6px;display:none">显示全部</button>
      </div>

      <div class="prog" id="prog" style="display:none">
        <div class="prog-top"><span id="progText">准备中…</span><span id="progMeta"></span></div>
        <div class="bar"><i id="progBar"></i></div>
      </div>

      <div class="list" id="list"></div>
      <div id="more" style="margin-top:16px;display:none"><button style="width:100%" id="moreBtn">继续匹配</button></div>

      <div class="foot">
        后端服务 <code id="origin"></code><br />
        匹配由服务端完成：WBI 签名、cookie 会话、限流重试、多路检索融合与本地重排序。
      </div>
    </div>

    <div class="sheet-bg" id="sheetBg"></div>
    <div class="sheet" id="sheet"><div class="handle"></div><div id="sheetBody"></div></div>
    <div class="toast" id="toast"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const fmtCount = (n) => { n = Number(n) || 0; return n >= 1e8 ? (n / 1e8).toFixed(1) + '亿' : n >= 1e4 ? (n / 1e4).toFixed(1) + '万' : String(n); };
      const fmtDur = (s) => { if (s == null) return '--:--'; s = Math.round(s); const m = Math.floor(s / 60), ss = s % 60; return m + ':' + String(ss).padStart(2, '0'); };
      const fmtDate = (t) => { if (!t) return '—'; const d = new Date(t * 1000); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

      const CONF = {
        high: { l: '很确定', c: 'var(--positive)', b: 'rgba(63,192,122,.14)' },
        medium: { l: '可能对', c: 'var(--warn)', b: 'rgba(242,179,61,.14)' },
        low: { l: '不太确定', c: 'var(--danger)', b: 'rgba(229,86,111,.14)' },
        error: { l: '出错', c: 'var(--danger)', b: 'rgba(229,86,111,.14)' },
        none: { l: '没找到', c: 'var(--faint)', b: 'transparent' },
      };
      const NEUTRAL_TAG = 'var(--faint)';
      const NEUTRAL_BG = 'var(--raised)';
      const BD = { title: '歌名', artist: '歌手', duration: '时长', mv: 'MV', bilingual: '双语', play: '播放', category: '分区', officialUp: '官方', officialMain: '官方正片', penalty: '降权' };

      $('origin').textContent = location.origin;
      let es = null, results = [], offset = 0, playlistRef = null, runPrefer = true;
      let auto = false, startedAt = 0;
      const setRunning = (on) => {
        for (const id of ['go', 'goAll']) $(id).style.display = on ? 'none' : '';
        $('stop').style.display = on ? '' : 'none';
      };

      const toast = (m) => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800); };

      // ---------------- 健康检查 ----------------
      async function health() {
        const s = $('status'), t = $('statusText');
        try {
          const r = await fetch('/api/health');
          const j = await r.json();
          s.className = 'status ok';
          t.textContent = j.bili?.hasBuvid3 ? 'B站会话正常' : '已连接';
          $('go').disabled = false;
        } catch {
          s.className = 'status fail';
          t.textContent = '后端异常';
        }
      }
      health();

      // ---------------- 开始匹配 ----------------
      function reset() {
        if (es) { es.close(); es = null; }
        results = []; offset = 0; playlistRef = null;
        $('list').innerHTML = ''; $('more').style.display = 'none';
        $('prog').style.display = 'block'; $('progBar').style.width = '0';
        $('progText').textContent = '正在读取歌单…'; $('progMeta').textContent = '';
      }

      function start(input, isAuto = false) {
        if (!input) return;
        reset();
        auto = isAuto;
        startedAt = Date.now();
        runPrefer = $('preferBilingual').checked;
        setRunning(true);
        $('progText').textContent = auto ? '连续匹配中…' : '正在读取歌单…';
        const qs = new URLSearchParams({
          id: input,
          limit: $('pageSize').value,
          offset: '0',
          preferBilingual: runPrefer ? '1' : '0',
        });
        stream(qs);
      }

      function runNextBatch() {
        setRunning(true);
        stream(new URLSearchParams({
          id: playlistRef.id, limit: $('pageSize').value, offset: String(results.length),
          preferBilingual: runPrefer ? '1' : '0',
        }));
      }

      function stream(qs) {
        const src = new EventSource('/api/match/stream?' + qs.toString());
        es = src;
        src.addEventListener('playlist', (e) => {
          if (es !== src) return;
          const pl = JSON.parse(e.data);
          playlistRef = pl;
          $('progText').textContent = auto
            ? `《${pl.name}》 · 匹配中`
            : `《${pl.name}》 · 共 ${pl.trackCount} 首`;
        });
        src.addEventListener('progress', (e) => {
          if (es !== src) return;
          const p = JSON.parse(e.data);
          if (auto && playlistRef) {
            const total = playlistRef.trackCount || p.total;
            $('progBar').style.width = Math.min(100, (results.length / total) * 100) + '%';
            $('progMeta').textContent = `${results.length}/${total}`;
          } else {
            $('progBar').style.width = (p.total ? (p.done / p.total) * 100 : 0) + '%';
            $('progMeta').textContent = `${p.done}/${p.total}`;
          }
          if (p.done) $('progText').textContent = `《${playlistRef?.name ?? ''}》 · 匹配中`;
        });
        src.addEventListener('song', (e) => { if (es === src) insert(JSON.parse(e.data)); });
        src.addEventListener('done', (e) => {
          if (es !== src) return;
          const d = JSON.parse(e.data);
          if (auto && d.hasMore) {
            const total = playlistRef?.trackCount || 0;
            $('progBar').style.width = (total ? (results.length / total) * 100 : 0) + '%';
            $('progMeta').textContent = `${results.length}/${total}`;
            $('progText').textContent = `《${playlistRef?.name ?? ''}》 · 匹配中`;
            src.close();
            es = null;
            runNextBatch();
            return;
          }
          $('progBar').style.width = '100%';
          $('progText').textContent = `《${playlistRef?.name ?? ''}》 · 已完成`;
          $('progMeta').textContent = `用时 ${((auto ? Date.now() - startedAt : d.elapsedMs) / 1000).toFixed(1)}s`;
          $('more').style.display = d.hasMore ? 'block' : 'none';
          $('moreBtn').textContent = `继续匹配后面 ${Math.min(Number($('pageSize').value), Math.max((playlistRef?.trackCount ?? 0) - results.length, 0))} 首`;
          src.close();
          es = null;
          setRunning(false);
          renderHistory();
        });
        src.addEventListener('error', (e) => {
          if (es !== src) return;
          let msg = '连接中断';
          try { msg = JSON.parse(e.data).message; } catch {}
          auto = false;
          $('progText').textContent = '出错：' + msg;
          src.close();
          es = null;
          setRunning(false);
        });
      }

      function updatePrefToggle() {
        $('prefToggle').textContent = $('preferBilingual').checked ? '双语优先' : '热度优先';
      }
      $('prefToggle').onclick = () => {
        const box = $('preferBilingual');
        box.checked = !box.checked;
        updatePrefToggle();
        toast(box.checked ? '已开启双语优先' : '已关闭双语：按播放/弹幕/本家排序');
      };
      $('preferBilingual').addEventListener('change', updatePrefToggle);
      updatePrefToggle();

      $('go').onclick = () => start($('input').value.trim());
      $('goAll').onclick = () => start($('input').value.trim(), true);
      $('stop').onclick = () => {
        auto = false;
        if (es) { es.close(); es = null; }
        setRunning(false);
        $('progText').textContent = `《${playlistRef?.name ?? ''}》 · 已停止`;
      };
      $('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') start($('input').value.trim()); });
      document.querySelectorAll('[data-sample]').forEach((b) => {
        b.onclick = () => { $('input').value = b.dataset.sample; start(b.dataset.sample); };
      });
      $('moreBtn').onclick = () => {
        if (!playlistRef) return;
        auto = false;
        $('more').style.display = 'none';
        runNextBatch();
      };
      $('clearCache').onclick = async () => {
        try { await fetch('/api/cache/clear', { method: 'POST' }); toast('缓存已清空'); }
        catch { toast('清理失败'); }
      };

      // ---------------- 历史 ----------------
      const fmtAgo = (ms) => {
        const s = (Date.now() - ms) / 1000;
        if (s < 60) return '刚刚';
        if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
        if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
        if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前';
        return fmtDate(ms / 1000);
      };
      let histShowAll = false, histTimer = null;

      async function renderHistory() {
        const q = $('histQ').value.trim();
        let items;
        try { items = (await (await fetch('/api/history?q=' + encodeURIComponent(q))).json()).items || []; }
        catch { return; }
        if (!q && !items.length) { $('histPanel').style.display = 'none'; return; }
        $('histPanel').style.display = '';
        $('histCount').textContent = q ? `${items.length} 个结果` : `${items.length} 个`;
        const shown = histShowAll || q ? items : items.slice(0, 5);
        $('histAll').style.display = shown.length < items.length ? '' : 'none';
        $('histList').innerHTML = shown.length ? shown.map((e) => `
          <div class="hist" data-id="${esc(e.id)}">
            <img loading="lazy" src="${esc(e.cover)}" alt="" />
            <div class="grow">
              <div class="hn">${esc(e.name)}</div>
              <div class="hm">${e.trackCount} 首 · 已匹配 ${e.matched}${e.bilingualNeeded ? ` · 双语 <b>${e.bilingualHit}</b>/${e.bilingualNeeded}` : ''} · ${fmtAgo(e.lastViewedAt)}</div>
            </div>
            <button class="del" data-del="${esc(e.id)}" aria-label="删除">删除</button>
          </div>`).join('') : '<p class="hint" style="text-align:center">没有符合的歌单</p>';
        $('histList').querySelectorAll('.hist').forEach((n) => {
          n.onclick = (ev) => {
            const del = ev.target.closest('[data-del]');
            if (del) { ev.stopPropagation(); removeHistory(del.dataset.del); return; }
            openFromHistory(n.dataset.id);
          };
        });
      }

      async function removeHistory(id) {
        try { await fetch('/api/history/delete?id=' + encodeURIComponent(id), { method: 'POST' }); toast('已删除'); }
        catch { toast('删除失败'); }
        renderHistory();
      }

      async function openFromHistory(id) {
        let j;
        try {
          const res = await fetch('/api/history/item?id=' + encodeURIComponent(id));
          j = await res.json();
          if (!res.ok) throw new Error(j.error || 'HTTP ' + res.status);
        } catch (e) { toast('打开失败：' + e.message); return; }
        reset();
        const pl = j.playlist;
        playlistRef = pl;
        runPrefer = j.preferBilingual;
        $('input').value = pl.id;
        j.results.forEach(insert);
        $('progText').textContent = `《${pl.name}》 · 来自历史记录`;
        $('progMeta').textContent = `已匹配 ${j.results.length}/${pl.trackCount}`;
        $('progBar').style.width = (pl.tracks.length ? (j.results.length / pl.tracks.length) * 100 : 0) + '%';
        const left = Math.max(pl.tracks.length - j.results.length, 0);
        $('more').style.display = left ? 'block' : 'none';
        $('moreBtn').textContent = `继续匹配后面 ${Math.min(Number($('pageSize').value), left)} 首`;
        $('prog').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      $('histQ').oninput = () => { clearTimeout(histTimer); histTimer = setTimeout(renderHistory, 150); };
      $('histAll').onclick = () => { histShowAll = true; renderHistory(); };
      renderHistory();

      // ---------------- 渲染 ----------------
      function insert(r) {
        results.push(r);
        const list = $('list');
        const node = renderSong(r);
        // 后端是并发匹配的，结果顺序可能乱，按 index 插到正确位置
        const after = [...list.children].find((c) => Number(c.dataset.index) > r.index);
        list.insertBefore(node, after ?? null);
      }

      function tag(label, color, bg) { return `<span class="tag" style="color:${color};background:${bg}">${esc(label)}</span>`; }

      function renderSong(r) {
        const n = el('div', 'song');
        n.dataset.index = r.index;
        const conf = CONF[r.confidence] ?? CONF.none;
        const b = r.best;

        const head = el('div', 'song-head');
        head.appendChild(el('div', 'idx', String(r.index + 1).padStart(2, '0')));
        const mid = el('div', 'grow');
        mid.appendChild(el('div', 'song-title', esc(r.song.title)));
        mid.appendChild(el('div', 'song-sub', esc(r.song.artistText + (r.song.durationSec ? ' · ' + fmtDur(r.song.durationSec) : ''))));
        head.appendChild(mid);
        head.appendChild(el('div', 'tags', tag(r.langLabel, NEUTRAL_TAG, NEUTRAL_BG) + tag(conf.l, conf.c, conf.b)));
        n.appendChild(head);

        if (!b) {
          n.appendChild(el('div', 'none', r.error ? '匹配出错：' + esc(r.error) : '没有找到可信的 MV 候选'));
          return n;
        }

        const cand = el('div', 'cand');
        cand.innerHTML = `
          <div class="thumb"><img loading="lazy" src="${esc(b.cover)}" alt="" /><span class="dur">${esc(b.durationText)}</span></div>
          <div class="cand-body">
            <div class="cand-title">${esc(b.title)}</div>
            <div class="cand-meta">${esc(b.author)} · ${fmtCount(b.play)}播放</div>
            <div class="tags">
              ${r.bilingualNeeded ? (b.bilingualHit >= 0.6 ? tag('双语字幕', 'var(--accent)', 'var(--accent-soft)') : b.bilingualHit > 0 ? tag('有字幕', 'var(--warn)', 'rgba(242,179,61,.14)') : tag('无字幕', 'var(--faint)', 'transparent')) : ''}
              ${b.mvHit >= 0.9 ? tag('MV', 'var(--muted)', NEUTRAL_BG) : ''}
              ${(b.negativeTags || []).slice(0, 2).map((t) => tag(t, 'var(--danger)', 'transparent')).join('')}
            </div>
          </div>`;
        cand.onclick = () => openSheet(b, r.song);
        n.appendChild(cand);

        if (b.breakdown) {
          const parts = Object.entries(b.breakdown).filter(([k, v]) => BD[k] && v !== 0)
            .map(([k, v]) => `${BD[k]} <b style="color:${v < 0 ? 'var(--danger)' : 'var(--muted)'}">${v > 0 ? '+' + v.toFixed(0) : v.toFixed(0)}</b>`);
          if (parts.length) n.appendChild(el('div', 'score', parts.join('　')));
        }
        if (b.reasons?.length) n.appendChild(el('div', 'reasons', esc(b.reasons.slice(0, 4).join(' · '))));

        const acts = el('div', 'acts');
        const play = el('button', 'primary', '在 B站 打开');
        play.onclick = () => window.open(b.url, '_blank', 'noopener');
        acts.appendChild(play);

        const more = el('div', 'more');
        more.style.display = 'none';
        if (r.candidates.length > 1) {
          const mb = el('button', '', `其它候选 ${r.candidates.length - 1}`);
          let built = false;
          mb.onclick = () => {
            if (!built) {
              r.candidates.slice(1).forEach((c, i) => {
                const cc = el('div', 'cand');
                cc.innerHTML = `
                  <div class="thumb"><img loading="lazy" src="${esc(c.cover)}" alt="" /><span class="dur">${esc(c.durationText)}</span></div>
                  <div class="cand-body">
                    <div class="cand-title">${esc(c.title)}</div>
                    <div class="cand-meta">#${i + 2} · ${esc(c.author)} · ${fmtCount(c.play)}播放 · 匹配分 ${c.score.toFixed(0)}</div>
                    <div class="tags">${c.bilingualHit >= 0.6 ? tag('双语字幕', 'var(--accent)', 'var(--accent-soft)') : ''}${c.mvHit >= 0.9 ? tag('MV', 'var(--muted)', NEUTRAL_BG) : ''}${(c.negativeTags || []).slice(0, 2).map((t) => tag(t, 'var(--danger)', 'transparent')).join('')}</div>
                  </div>`;
                cc.onclick = () => openSheet(c, r.song);
                more.appendChild(cc);
              });
              built = true;
            }
            const on = more.style.display === 'flex';
            more.style.display = on ? 'none' : 'flex';
            mb.textContent = on ? `其它候选 ${r.candidates.length - 1}` : '收起候选';
          };
          acts.appendChild(mb);
        }
        n.appendChild(acts);
        n.appendChild(more);
        return n;
      }

      // ---------------- 详情弹层 ----------------
      function openSheet(c, song) {
        const conf = CONF[c.confidence] ?? CONF.none;
        const body = $('sheetBody');
        body.innerHTML = `
          <h3>${esc(c.title)}</h3>
          <div class="tags">
            ${tag(conf.l, conf.c, conf.b)}
            ${tag('匹配分 ' + c.score.toFixed(0), 'var(--muted)', NEUTRAL_BG)}
            ${c.bilingualHit >= 0.6 ? tag('双语字幕', 'var(--accent)', 'var(--accent-soft)') : ''}
            ${c.mvHit >= 0.9 ? tag('MV', 'var(--muted)', NEUTRAL_BG) : ''}
          </div>
          <img class="big" src="${esc(c.cover)}" alt="" />
          <div class="kv">
            <div><div class="k">UP主</div><div class="v">${esc(c.author)}</div></div>
            <div><div class="k">播放 / 弹幕</div><div class="v">${fmtCount(c.play)} / ${fmtCount(c.danmaku)}</div></div>
            <div><div class="k">时长</div><div class="v">${esc(c.durationText || fmtDur(c.durationSec))}</div></div>
            <div><div class="k">分区</div><div class="v">${esc(c.typename || '—')}</div></div>
            <div><div class="k">发布</div><div class="v">${fmtDate(c.pubdate)}</div></div>
            <div><div class="k">BV号</div><div class="v">${esc(c.bvid)}</div></div>
          </div>
          <div class="blk"><div class="t">对应歌曲</div><p>${esc(song.title)} — ${esc(song.artistText)}</p></div>
          ${c.reasons?.length ? `<div class="blk"><div class="t">为什么推荐它</div><ul>${c.reasons.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
          ${c.negativeTags?.length ? `<div class="blk"><div class="t">已识别的减分特征</div><p>${esc(c.negativeTags.join('、'))}</p></div>` : ''}
          ${c.description ? `<div class="blk"><div class="t">视频简介</div><p>${esc(c.description.slice(0, 400))}</p></div>` : ''}
          <div class="row" style="margin-top:14px">
            <button class="primary" style="flex:1.4" onclick="window.open('${esc(c.url)}','_blank','noopener')">在 B站 打开</button>
            <button style="flex:1" id="copyLink">复制链接</button>
          </div>
          <button class="ghost" style="width:100%;margin-top:8px" id="closeSheet">关闭</button>`;
        body.querySelector('#copyLink').onclick = async () => {
          try { await navigator.clipboard.writeText(c.url); toast('链接已复制'); }
          catch { toast('复制失败，请长按链接'); }
        };
        body.querySelector('#closeSheet').onclick = closeSheet;
        $('sheet').classList.add('on');
        $('sheetBg').classList.add('on');
      }
      function closeSheet() { $('sheet').classList.remove('on'); $('sheetBg').classList.remove('on'); }
      $('sheetBg').onclick = closeSheet;

      // 支持用 ?id=xxx 直接打开
      const preset = new URLSearchParams(location.search).get('id');
      if (preset) { $('input').value = preset; start(preset); }
    </script>
  </body>
</html>
